<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <style>
      .title { font: 700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#111827; }
      .subtitle { font: 500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#4b5563; }
      .box-title { font: 700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#111827; }
      .box-text { font: 500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#374151; }
      .badge { font: 700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#ffffff; }
      .edge-label { font: 600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#6b7280; }
      .edge { stroke:#9ca3af; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .edge-strong { stroke:#2563eb; stroke-width:4; fill:none; marker-end:url(#arrowBlue); }
      .edge-alt { stroke:#7c3aed; stroke-width:3; fill:none; marker-end:url(#arrowPurple); stroke-dasharray:8 6; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9ca3af"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="680" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" class="title">Stress Project Model Lineage</text>
  <text x="60" y="88" class="subtitle">Frozen Baseline, independent branches, and the current champion</text>

  <!-- Edges -->
  <path class="edge" d="M300 205 C385 205, 410 170, 500 170"/>
  <text x="365" y="178" class="edge-label">median / quantile tests</text>

  <path class="edge-alt" d="M300 235 C405 265, 410 345, 500 345"/>
  <text x="360" y="304" class="edge-label">conservative blend branch</text>

  <path class="edge-strong" d="M705 170 C790 170, 800 170, 880 170"/>
  <text x="742" y="148" class="edge-label">feature probability tuning</text>

  <path class="edge-strong" d="M980 245 C980 305, 980 330, 980 392"/>
  <text x="996" y="320" class="edge-label">+ local pair-neighbor</text>

  <path class="edge-alt" d="M705 345 C795 345, 805 430, 880 430"/>

  <!-- V1 -->
  <g filter="url(#shadow)">
    <rect x="60" y="145" width="240" height="135" rx="18" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
    <rect x="78" y="163" width="120" height="26" rx="13" fill="#0f766e"/>
    <text x="138" y="181" text-anchor="middle" class="badge">FROZEN BASELINE</text>
    <text x="82" y="220" class="box-title">V1 Weighted Quantile ET</text>
    <text x="82" y="247" class="box-text">1,200 trees · q=0.51</text>
    <text x="82" y="270" class="box-text">Public MAE 0.1282776667</text>
  </g>

  <!-- V2/V4 -->
  <g filter="url(#shadow)">
    <rect x="500" y="110" width="205" height="120" rx="18" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="522" y="145" class="box-title">V2 / V4 Controls</text>
    <text x="522" y="174" class="box-text">q=0.50 median</text>
    <text x="522" y="197" class="box-text">q=0.505 conservative</text>
    <text x="522" y="220" class="box-text">Both rejected</text>
  </g>

  <!-- V14 -->
  <g filter="url(#shadow)">
    <rect x="500" y="285" width="205" height="125" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
    <rect x="518" y="303" width="145" height="26" rx="13" fill="#7c3aed"/>
    <text x="590" y="321" text-anchor="middle" class="badge">FORMER PUBLIC BEST</text>
    <text x="522" y="358" class="box-title">V14 Blend95</text>
    <text x="522" y="383" class="box-text">95% V1 + 5% auxiliary</text>
    <text x="522" y="405" class="box-text">Public MAE 0.1278085845</text>
  </g>

  <!-- V6 -->
  <g filter="url(#shadow)">
    <rect x="880" y="105" width="240" height="140" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <text x="902" y="143" class="box-title">V6 Adaptive Quantile Forest</text>
    <text x="902" y="172" class="box-text">1,200 trees · q=0.52</text>
    <text x="902" y="195" class="box-text">feature-copy probability tuning</text>
    <text x="902" y="218" class="box-text">V7 main component (85%)</text>
  </g>

  <!-- V7 -->
  <g filter="url(#shadow)">
    <rect x="850" y="392" width="300" height="175" rx="20" fill="#eff6ff" stroke="#1d4ed8" stroke-width="4"/>
    <rect x="872" y="412" width="150" height="28" rx="14" fill="#1d4ed8"/>
    <text x="947" y="431" text-anchor="middle" class="badge">CURRENT CHAMPION</text>
    <text x="874" y="474" class="box-title">V7 Pair-Neighbor Blend</text>
    <text x="874" y="503" class="box-text">85% V6 tree quantile</text>
    <text x="874" y="526" class="box-text">15% 28-pair 1-NN quantile</text>
    <text x="874" y="549" class="box-text">Audit3 MAE 0.146644</text>
    <text x="874" y="572" class="box-text">Public MAE 0.1272333333</text>
  </g>

  <!-- Footer legend -->
  <rect x="60" y="605" width="1080" height="42" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <circle cx="90" cy="626" r="7" fill="#0f766e"/>
  <text x="108" y="631" class="box-text">Baseline</text>
  <circle cx="235" cy="626" r="7" fill="#7c3aed"/>
  <text x="253" y="631" class="box-text">Former best</text>
  <circle cx="390" cy="626" r="7" fill="#1d4ed8"/>
  <text x="408" y="631" class="box-text">Current champion</text>
  <text x="650" y="631" class="box-text">Lower MAE is better · Public scores shown for submitted models</text>
</svg>
