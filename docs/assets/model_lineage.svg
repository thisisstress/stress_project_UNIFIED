<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Stress Project UNIFIED tracked team model lineage</title>
  <desc id="desc">Representative team presentation lineage tracked in UNIFIED, from V1 Weighted Quantile ExtraTrees to Team V7 Pair-Neighbor, BS V34, and the final BS 8/6 model.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#94A3B8"/>
    </marker>
    <marker id="arrowFinal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#7C3AED"/>
    </marker>
    <style>
      .title{font:700 36px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0F172A}
      .subtitle{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748B}
      .stage{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#FFFFFF;letter-spacing:.4px}
      .model{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0F172A}
      .desc{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .scoreLabel{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748B;letter-spacing:.3px}
      .score{font:800 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0F172A}
      .scoreFinal{font:800 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6D28D9}
      .minor{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748B}
      .footer{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748B}
    </style>
  </defs>

  <rect width="1600" height="760" rx="28" fill="url(#bg)"/>

  <text x="72" y="66" class="title">Stress Project UNIFIED · Tracked Team Model Lineage</text>
  <text x="72" y="98" class="subtitle">Representative models from the final presentation connected in UNIFIED; original provenance remains with each source repository.</text>

  <path d="M392 368 C430 368 446 368 482 368" fill="none" stroke="#94A3B8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M752 368 C790 368 806 368 842 368" fill="none" stroke="#94A3B8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1112 368 C1150 368 1166 368 1202 368" fill="none" stroke="#7C3AED" stroke-width="5" marker-end="url(#arrowFinal)"/>

  <g filter="url(#shadow)">
    <rect x="72" y="190" width="320" height="356" rx="24" fill="#FFFFFF" stroke="#0F766E" stroke-width="3"/>
    <rect x="96" y="216" width="118" height="30" rx="15" fill="#0F766E"/>
    <text x="155" y="236" text-anchor="middle" class="stage">BASELINE</text>
    <text x="96" y="286" class="model">V1 Weighted Quantile</text>
    <text x="96" y="315" class="model">ExtraTrees</text>
    <text x="96" y="354" class="desc">Weighted Quantile ExtraTrees</text>
    <text x="96" y="378" class="desc">Reproducible early Public anchor</text>
    <text x="96" y="429" class="scoreLabel">PUBLIC MAE</text>
    <text x="96" y="461" class="score">0.1282776667</text>
    <line x1="96" y1="482" x2="368" y2="482" stroke="#E2E8F0"/>
    <text x="96" y="512" class="minor">Early baseline preserved in UNIFIED</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="432" y="190" width="320" height="356" rx="24" fill="#FFFFFF" stroke="#D97706" stroke-width="3"/>
    <rect x="456" y="216" width="142" height="30" rx="15" fill="#D97706"/>
    <text x="527" y="236" text-anchor="middle" class="stage">TEAM MILESTONE</text>
    <text x="456" y="286" class="model">Team V7</text>
    <text x="456" y="315" class="model">Pair-Neighbor Blend</text>
    <text x="456" y="354" class="desc">ExtraTrees + Pair-Neighbor</text>
    <text x="456" y="378" class="desc">Local profile complement</text>
    <text x="456" y="429" class="scoreLabel">PUBLIC MAE</text>
    <text x="456" y="461" class="score">0.1272333333</text>
    <line x1="456" y1="482" x2="728" y2="482" stroke="#E2E8F0"/>
    <text x="456" y="510" class="minor">Internal MAE 0.146644</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="792" y="190" width="320" height="356" rx="24" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
    <rect x="816" y="216" width="138" height="30" rx="15" fill="#2563EB"/>
    <text x="885" y="236" text-anchor="middle" class="stage">BS MILESTONE</text>
    <text x="816" y="286" class="model">BS V34</text>
    <text x="816" y="315" class="model">Tree · Pair Joint Tuning</text>
    <text x="816" y="354" class="desc">Tree q=0.54 · Pair q=0.48</text>
    <text x="816" y="378" class="desc">Pair weight 0.28</text>
    <text x="816" y="429" class="scoreLabel">PUBLIC MAE</text>
    <text x="816" y="461" class="score">0.1271866667</text>
    <line x1="816" y1="482" x2="1088" y2="482" stroke="#E2E8F0"/>
    <text x="816" y="510" class="minor">Internal MAE 0.148033</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1152" y="166" width="376" height="404" rx="28" fill="#FAF5FF" stroke="#9333EA" stroke-width="5"/>
    <rect x="1178" y="194" width="150" height="32" rx="16" fill="#9333EA"/>
    <text x="1253" y="215" text-anchor="middle" class="stage">FINAL ADOPTED</text>
    <text x="1178" y="270" class="model">BS 8/6</text>
    <text x="1178" y="300" class="model">Final Integrated Model</text>
    <text x="1178" y="342" class="desc">ExtraTrees 76% + Pair 24%</text>
    <text x="1178" y="368" class="desc">Gender drop · Fold-local winsorize</text>
    <text x="1178" y="394" class="desc">Near-duplicate Override</text>
    <text x="1178" y="446" class="scoreLabel">PUBLIC MAE</text>
    <text x="1178" y="482" class="scoreFinal">0.1266866667</text>
    <line x1="1178" y1="505" x2="1500" y2="505" stroke="#E9D5FF"/>
    <text x="1178" y="534" class="minor">Internal MAE 0.147300 · Private 0.1473</text>
  </g>

  <rect x="72" y="624" width="1456" height="72" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="96" y="654" class="footer">Representative team presentation lineage tracked in UNIFIED · Lower Public MAE is better.</text>
  <text x="96" y="678" class="footer">UNIFIED connects verified lineage and provenance; source repositories retain original research ownership. V14, V4, and independent Gower research remain archived.</text>
</svg>
